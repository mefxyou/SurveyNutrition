<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12372A">
<title>استبيان تدريب التغذية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4E4;--ink:#17261F;--muted:#64746B;--card:#fff;--line:#EBDDC6;--sec:#FF7A3D;--deep:#12372A;--soft:#FFFCF6;--r:22px}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:'Tajawal','Segoe UI',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;padding-bottom:96px;-webkit-tap-highlight-color:transparent}

/* ---------- الشريط العلوي ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,244,228,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:auto;padding:10px 16px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.pctbadge{font-weight:800;background:var(--deep);color:#fff;border-radius:999px;padding:2px 13px;font-size:14px}

main{max-width:760px;margin:18px auto;padding:0 16px}

/* ---------- الواجهة الترحيبية ---------- */

/* ---------- رأس القسم ---------- */
.sh{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
.sic{flex:0 0 auto;width:64px;height:64px;border-radius:22px;background:var(--sec);color:#fff;font-weight:800;display:grid;place-items:center;font-size:30px;box-shadow:0 10px 22px -8px var(--sec);transform:rotate(-6deg)}
.sh small{color:var(--sec);font-weight:800;font-size:13px;letter-spacing:.2px}
.sh h2{font-size:25px;font-weight:800;line-height:1.25}
.sh p{color:var(--muted);font-size:14.5px}
.note{background:#FFF;border:2px dashed var(--sec);border-radius:18px;padding:11px 15px;margin-bottom:14px;font-size:14.5px}

/* ---------- بطاقة السؤال ---------- */
.q{background:var(--card);border-radius:var(--r);padding:18px 18px 20px;margin-bottom:14px;box-shadow:0 2px 0 var(--line),0 12px 24px -16px rgba(31,58,74,.28);border:1px solid var(--line);transition:.2s}
.q.sub{margin-inline-start:22px;border-inline-start:5px solid var(--sec);border-radius:18px;background:var(--soft);animation:pop .25s ease}
.q.err{border-color:#E5484D;box-shadow:0 0 0 4px rgba(229,72,77,.15);animation:shake .35s}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.qh{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.num{flex:0 0 auto;min-width:34px;height:34px;padding:0 9px;border-radius:12px;background:var(--sec);color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center;direction:ltr}
.sub .num{background:#fff;color:var(--sec);border:2px solid var(--sec);font-size:13px}
.qh h3{font-size:17.5px;font-weight:700;line-height:1.5}
.qh h3 em{color:#E5484D;font-style:normal}
.hint{color:var(--muted);font-size:13.5px;margin-top:2px}

/* ---------- الخيارات ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:600;border:2px solid var(--line);background:#fff;color:var(--ink);padding:8px 16px;border-radius:999px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px;line-height:1.4}
.chip:hover{border-color:var(--sec)}
.chip.on{background:var(--sec);border-color:var(--sec);color:#fff}
.chip.sm{padding:5px 13px;font-size:14px}
.chip .sw{width:20px;height:20px;border-radius:50%;border:2px solid rgba(0,0,0,.18);flex:0 0 auto}
.chip .zn{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:7px;background:rgba(0,0,0,.08);font-size:12px}
.chip.on .zn{background:rgba(255,255,255,.28)}
.chip.add{margin-top:10px;border-style:dashed}
.txt{font:inherit;width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:#fff;color:var(--ink);outline:none;transition:.15s}
.txt:focus{border-color:var(--sec);box-shadow:0 0 0 4px color-mix(in srgb,var(--sec) 18%,transparent)}
.other{margin-top:10px}
textarea.txt{resize:vertical;min-height:84px}
.numrow{display:flex;align-items:center;gap:8px}
.txt.num{width:130px;text-align:center;font-weight:700;font-size:18px}
.unit{color:var(--muted);font-weight:600}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.nf>span{display:block;font-weight:700;font-size:14.5px;margin-bottom:5px}

/* ---------- جدول الأطعمة ---------- */
.mrow{border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:10px;background:var(--soft)}
.mrow:first-child{margin-top:0}
.mname{font-weight:800;margin-bottom:2px}
.mline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px}
.mlab{font-size:13.5px;color:var(--muted);font-weight:700;min-width:54px}
.mlab.sp{margin-inline-start:14px;min-width:0}
.mline .chip.sm{animation:pop .2s ease}

/* ---------- الترتيب ---------- */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px}
.rk{display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px solid var(--line);border-radius:14px;padding:6px 12px;background:#fff;cursor:pointer;transition:.15s}
.rk span{font-weight:600}
.rk.set{border-color:var(--sec);background:color-mix(in srgb,var(--sec) 10%,#fff)}
.rk select{font:inherit;font-weight:800;border:0;background:var(--sec);color:#fff;border-radius:10px;padding:3px 4px;width:48px;text-align:center;text-align-last:center;appearance:none;-webkit-appearance:none;cursor:pointer}
.rk select.empty{background:#EFE6D5;color:var(--muted)}
.xrow{display:grid;grid-template-columns:1fr 60px 40px;gap:8px;margin-top:8px;align-items:center}
.xrow select{font:inherit;font-weight:800;border:2px solid var(--line);border-radius:12px;padding:9px 4px;background:#fff;color:var(--muted);text-align:center;text-align-last:center;cursor:pointer}
.xrow select.set{background:var(--sec);border-color:var(--sec);color:#fff}
.xrow .x{border:0;background:#EFE6D5;border-radius:12px;height:100%;min-height:40px;cursor:pointer;color:var(--muted)}

/* ---------- شريط النسبة ---------- */
.scale{display:flex;align-items:flex-start;gap:14px}
.sl-col{flex:1;min-width:0}
.sl-col input{display:block;width:100%;accent-color:var(--sec);height:30px;cursor:pointer}
.ticks{display:flex;justify-content:space-between;padding:0 7px;margin-top:0;font-size:11px;color:var(--muted);font-weight:700}
.scale output{min-width:92px;text-align:center;font-weight:800;font-size:20px;background:var(--sec);color:#fff;border-radius:12px;padding:3px 10px;margin-top:2px}
.scale.un output{background:#EFE6D5;color:var(--muted);font-size:13px;padding:8px 8px}

/* ---------- التحاليل ---------- */
.rowline{display:grid;grid-template-columns:1.3fr 1fr 40px;gap:8px;margin-bottom:8px}
.rowline .x{border:0;background:#EFE6D5;border-radius:12px;cursor:pointer;font-size:15px;color:var(--muted)}
@media(max-width:520px){.rowline{grid-template-columns:1fr 1fr 40px}}

/* ---------- الخرائط ---------- */
.mapwrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:10px}
svg.map{width:100%;max-width:440px;height:auto;touch-action:manipulation}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.zone rect{fill:var(--zc);stroke:#fff;stroke-width:2;cursor:pointer;transition:fill .15s}
.zone:hover rect{filter:brightness(.94)}
.zone.sel rect{fill:var(--sec)}
.znum{font:800 15px 'Tajawal',sans-serif;fill:#17261F;text-anchor:middle;pointer-events:none}
.zone.sel .znum{fill:#fff}
.cap{font:700 13px 'Tajawal',sans-serif;fill:#64746B;text-anchor:middle}
.ear{fill:#F0D3B8;stroke:#CDAE91;stroke-width:2}
.outline{fill:none;stroke:#8B6B4E;stroke-width:3;pointer-events:none}
.deco{fill:#8B6B4E;opacity:.55;pointer-events:none}
.deco.ln{fill:none;stroke:#8B6B4E;stroke-width:3;stroke-linecap:round}
.torso{fill:#F6E3D0;stroke:#C9A98C;stroke-width:3}

/* ---------- المراجعة والإرسال ---------- */
.review{background:#fff;border-radius:28px;padding:24px 20px;border:1px solid var(--line)}
.review h2{font-size:26px;font-weight:800}
.review>p{color:var(--muted);margin:4px 0 16px}
.sl{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--soft);border:1px solid var(--line);margin-bottom:8px}
.sl .e{flex:0 0 auto;width:32px;height:32px;border-radius:10px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.sl b{flex:1}
.sl small{color:var(--muted);font-weight:700}
.sl button{font:inherit;font-weight:700;border:0;background:#fff;border:2px solid var(--line);border-radius:10px;padding:2px 12px;cursor:pointer}
.warn{background:#FFF3CD;border:2px solid #F2C94C;border-radius:16px;padding:12px 14px;margin:14px 0;font-size:14.5px}
.btn{font:inherit;font-weight:800;border:0;border-radius:16px;padding:14px 22px;cursor:pointer;font-size:16px;transition:.15s}
.btn.pri{background:var(--deep);color:#fff;flex:1}
.btn.ghost{background:#fff;border:2px solid var(--line);color:var(--ink)}
.btn.big{width:100%;background:var(--sec);color:#fff;font-size:18px;padding:16px;margin-top:14px;box-shadow:0 10px 22px -10px var(--sec)}
.btn:disabled{opacity:.6;cursor:wait}
.btn:active{transform:scale(.98)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msg{margin-top:12px;padding:12px 14px;border-radius:14px;font-weight:600}
.msg.bad{background:#FDE7E7;color:#9B1C1C}
details{margin-top:16px}
summary{cursor:pointer;font-weight:700}
pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:13.5px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px;max-height:340px;overflow:auto}
.thanks{text-align:center;background:#fff;border-radius:30px;padding:44px 22px;border:1px solid var(--line)}
.thanks .big{font-size:76px;animation:pop .5s ease}
.thanks h2{font-size:28px;font-weight:800;margin:8px 0}
.thanks p{color:var(--muted)}

/* ---------- أزرار التنقل ---------- */
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--deep);color:#fff;padding:10px 20px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:40;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:520px){.hero h1{font-size:25px;max-width:100%}.q{padding:16px 14px 18px}.q.sub{margin-inline-start:12px}.sic{width:56px;height:56px;font-size:28px}.sh h2{font-size:22px}}
.nav{position:fixed;bottom:0;inset-inline:0;z-index:20;background:rgba(255,244,228,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.nav-in{max-width:760px;margin:auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.blobs i:nth-child(1){width:340px;height:340px;background:#FFC49B;top:-90px;right:-90px}
.blobs i:nth-child(2){width:300px;height:300px;background:#B9F0CE;bottom:8%;left:-110px}
.blobs i:nth-child(3){width:260px;height:260px;background:#FFE08A;top:45%;right:-100px}
.brand .ic{width:38px;height:38px;border-radius:13px;background:var(--deep);display:grid;place-items:center;font-size:21px}
.barwrap{max-width:760px;margin:9px auto 0;padding:0 16px}
.bar{height:8px;background:#EADFCB;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF7A3D,#FFB020,#2E9E5B);border-radius:99px;transition:width .35s}
.steps{max-width:760px;margin:auto;display:flex;gap:8px;overflow-x:auto;padding:12px 16px 14px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;width:42px;height:42px;border-radius:14px;border:2px solid var(--line);background:#fff;font:800 17px inherit;font-family:inherit;color:var(--ink);display:grid;place-items:center;cursor:pointer;position:relative;transition:.2s;padding:0}
.step.cur{background:var(--c);border-color:var(--c);color:#fff;transform:translateY(-2px) scale(1.08);box-shadow:0 6px 14px -4px var(--c)}
.step.done::after{content:"✓";position:absolute;bottom:-6px;inset-inline-end:-5px;width:17px;height:17px;border-radius:50%;background:#1F8A5B;color:#fff;font-size:10px;display:grid;place-items:center;font-weight:800;border:2px solid var(--bg)}
.hero{position:relative;overflow:hidden;background:var(--deep);color:#fff;border-radius:30px;padding:28px 24px;margin-bottom:22px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%}
.hero::before{width:200px;height:200px;background:#FF7A3D;opacity:.9;left:-60px;top:-70px}
.hero::after{width:150px;height:150px;background:#FFC83D;opacity:.9;left:-30px;bottom:-85px}
.hero h1,.pills{z-index:1}
.hero h1{position:relative;font-size:30px;line-height:1.3;font-weight:800;max-width:80%}
.pills{position:relative;display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pills span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:99px;font-size:13.5px;font-weight:500}
.report{background:#fff;border-radius:22px;padding:22px;border:1px solid var(--line)}
.rp-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.rp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:3px solid var(--sec);padding-bottom:12px;margin-bottom:14px}
.rp-head h1{font-size:21px;font-weight:800;line-height:1.3}
.rp-head p{color:var(--muted);font-size:13px;direction:ltr;text-align:start}
.rp-who{text-align:end}.rp-who b{display:block;font-size:21px}.rp-who span{color:var(--muted);font-size:14px;direction:ltr;display:inline-block}
.rp-key{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;background:#FFF6EC;border:2px solid var(--sec);border-radius:16px;padding:12px;margin-bottom:16px}
.rp-key small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.rp-key b{font-size:15px;font-weight:800}
.rp-sec{margin-bottom:14px}
.rp-sec h3{background:var(--c);color:#fff;padding:6px 12px;border-radius:10px;display:flex;gap:10px;align-items:center;font-size:16px;font-weight:800;break-after:avoid}
.rp-sec h3 b{background:rgba(255,255,255,.25);min-width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px}
.rp-sec table{width:100%;border-collapse:collapse}
.rp-sec td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
.rp-sec tr{break-inside:avoid}
.rq{width:42%;font-weight:700}
.rn{display:inline-block;color:var(--c);font-weight:800;margin:0 0 0 7px;direction:ltr}
.paste textarea{min-height:140px;direction:ltr;text-align:left}
body.rmode .top,body.rmode .nav{display:none}
body.rmode{padding-bottom:30px}
@media print{body{background:#fff;padding:0}.top,.nav,.noprint,.toast,.blobs{display:none!important}main{max-width:none;margin:0;padding:0}.report{border:0;padding:0;border-radius:0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:A4;margin:12mm}}
</style>
</head>
<body>
<div class="blobs" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="top">
  <div class="top-in">
    <div class="brand"><span class="ic">🥗</span><span id="brandTitle">استبيان تدريب التغذية</span></div>
    <span class="pctbadge" id="pct">0%</span>
  </div>
  <div class="barwrap"><div class="bar"><i id="barFill"></i></div></div>
  <nav class="steps" id="steps" aria-label="الأقسام"></nav>
</header>

<main id="main"></main>

<footer class="nav" id="nav">
  <div class="nav-in">
    <button class="btn ghost" id="prev" type="button">→ السابق</button>
    <button class="btn pri" id="next" type="button">التالي ←</button>
  </div>
</footer>
<div class="toast" id="toast"></div>
<noscript><p style="padding:20px;text-align:center">فضلاً فعّل الجافاسكربت لعرض الاستبيان.</p></noscript>

<script>
(function(){

const CONFIG = {

  emailSubject: "استبيان تدريب التغذية — إجابة جديدة"
};

/* ===================== مساعدات الشروط ===================== */
const YN = ["نعم","لا"];
const hasAllergy = a => Array.isArray(a.allergy) && a.allergy.length > 0 && !a.allergy.includes("لا يوجد");
const anySym = k => a => Array.isArray(a[k]) && a[k].length > 0 && !a[k].includes("لا");
const LATIN = "‎";

/* ===================== الأقسام والأسئلة ===================== */
const SECTIONS = [
{id:"basic",icon:"👤",title:"المعلومات الأساسية",color:"#FF7A3D",qs:[
  {id:"name",t:"text",q:"الاسم",nonum:true,req:true,ph:"اكتب اسمك"},

  {id:"pregDur",t:"text",sub:true,q:"كم مدة حملك؟",hint:"مثلاً: الشهر الخامس",show:a=>a.preg==="حامل"},
  {id:"nursDur",t:"text",sub:true,q:"كم مدة إرضاعك؟",hint:"مثلاً: من ثمانية أشهر",show:a=>a.preg==="مرضعة"},
]},
{id:"health",icon:"🩺",title:"التاريخ الصحي",color:"#D6456B",qs:[

(function prep(){
  let n = 0, last = null; const sc = {};
  SECTIONS.forEach((s,si)=>s.qs.forEach(q=>{
    q.sec = si; Q[q.id] = q;
    if(q.o) q.o = q.o.map(o=>typeof o==="string"?{l:o}:o);
    if(q.nonum){ q.no = ""; return; }
    if(q.sub && last){ sc[last.id]=(sc[last.id]||0)+1; q.no = last.no+"."+sc[last.id]; }
    else { q.no = String(++n); last = q; }
  }));
})();

  const ear = cx=>`<ellipse class="ear" cx="${cx}" cy="135" rx="9" ry="19"/>`;

    + zg(1,R(20,20,160,48,"hf"),100,50)
    + zg(2,R(58,68,84,37,"hf"),100,92)
    + zg(3,R(20,68,38,72,"hf"),43,108)
    + zg(4,R(142,68,38,72,"hf"),157,108)
    + zg(5,R(58,105,84,35,"hf"),100,127)
    + zg(6,R(20,140,160,90,"hf"),100,178)
    + `<ellipse class="outline" cx="100" cy="125" rx="72" ry="95"/>`
    + `<ellipse class="deco" cx="74" cy="122" rx="8" ry="5"/><ellipse class="deco" cx="126" cy="122" rx="8" ry="5"/>`
    + `<path class="deco ln" d="M100 134 L95 158 Q100 162 105 158"/><path class="deco ln" d="M80 198 Q100 212 120 198"/>`
    + `<text class="cap" x="100" y="276">من الأمام</text></g>`;

/* ===================== تنسيق الإجابات (للملخص والإيميل) ===================== */
function fmt(q){
  const v = A[q.id], oth = k=>String(A[k]||"").trim();
  switch(q.t){
    case "text": case "textarea": return String(v||"").trim();
    case "number": return (v===undefined||v==="")?"":v+(q.u?" "+q.u:"");
    case "single": { if(!v) return ""; const o=q.o.find(x=>x.l===v); return o&&o.other&&oth(q.id+"_o")?v+": "+oth(q.id+"_o"):v; }
    case "multi": { if(!v||!v.length) return ""; return v.map(l=>{const o=q.o.find(x=>x.l===l); return o&&o.other&&oth(q.id+"_o")?l+": "+oth(q.id+"_o"):l;}).join("، "); }
    case "rank": { const e=Object.entries(A[q.id]||{}).map(([k,n])=>({k:k,n:n})); (A[q.id+"_x"]||[]).forEach(x=>{ if(String(x.n||"").trim()) e.push({k:String(x.n).trim(),n:x.r||999}); }); e.sort((a,b)=>a.n-b.n); return e.map(o=>(o.n===999?"—":o.n+".")+" "+o.k).join("\n"); }
    case "matrix": { const m=A[q.id]||{}; const L=q.items.map(it=>{ const d=m[it]; if(!d) return ""; const p=[]; if(d.like)p.push("يحب: "+d.like); if(d.eat)p.push("يأكل: "+d.eat); if(d.amount)p.push("الكمية: "+d.amount); if(d.prep&&d.prep.length)p.push(q.prep.label+": "+d.prep.join("، ")); return p.length?(q.items.length>1?it+" — ":"")+p.join(" | "):""; }).filter(Boolean); const o=A[q.id+"_mo"]; if(o){ const p=[]; if(o.like)p.push("يحب: "+o.like); if(o.eat)p.push("يأكل: "+o.eat); if(o.amount)p.push("الكمية: "+o.amount); const nm=String(o.n||"").trim(); if(p.length||nm) L.push((nm||"أخرى")+(p.length?" — "+p.join(" | "):"")); } return L.join("\n"); }
    case "scale": return v===undefined?"":v+"%";
    case "rows": return (v||[]).filter(r=>String(r.n||"").trim()||String(r.v||"").trim()).map(r=>(r.n||"؟")+": "+(r.v||"—")).join("\n");
    case "numbers": { const o=A[q.id]||{}; return q.f.filter(f=>o[f.k]!==undefined&&o[f.k]!=="").map(f=>f.l+": "+o[f.k]+(f.u?" "+f.u:"")).join(" | "); }
    case "map": { const names=q.map==="head"?HEAD:BELLY; const z=(v||[]).map(n=>n+" ("+names[n]+")").join("، "); const t=oth(q.id+"_t"); return [z,t].filter(Boolean).join(" — "); }
  }
  return "";
}
function stats(s){ let t=0,d=0; s.qs.forEach(q=>{ if(!vis(q)) return; t++; if(fmt(q)) d++; }); return {t,d}; }
function totals(){ let t=0,d=0; SECTIONS.forEach(s=>{const x=stats(s); t+=x.t; d+=x.d;}); return {t,d}; }
function keyFacts(){
  const g=id=>{ const q=Q[id]; return q&&vis(q)?fmt(q):""; };
  const j=(...p)=>p.filter(Boolean).join(" — ");
  const F=[["العمر",g("age")],["الطول",g("height")],["الوزن",g("weight")]];
  const h=parseFloat(A.height), w=parseFloat(A.weight);
  if(h>50&&w>10) F.push(["مؤشر كتلة الجسم (محسوب)",(w/((h/100)*(h/100))).toFixed(1)]);
  F.push(["الحالة الاجتماعية",g("marital")]);
  F.push(["الحمل والرضاعة",j(g("preg"),g("pregDur"),g("nursDur"))]);
  F.push(["الأمراض المزمنة",j(g("chronic"),g("chronicInfo"))]);
  F.push(["الحساسية",j(g("allergy"),g("allergyDetail"))]);
  F.push(["الأدوية",g("meds")]);
  F.push(["الفيتامينات",g("vits")]);
  return F.filter(x=>x[1]);
}
function buildSummary(link){
  const L = ["📋 استبيان تدريب التغذية — "+(A.name||"بدون اسم"), "التاريخ: "+new Date().toLocaleString("en-GB")];
  if(A.tg) L.push("التلقرام: "+A.tg);
  if(link) L.push("", "📄 تقرير PDF منظم — اضغطي الرابط ثم «حفظ PDF»:", link);
  const kf=keyFacts(); if(kf.length){ L.push("", "━━━ الأهم ━━━"); kf.forEach(x=>L.push(x[0]+": "+x[1])); }
  SECTIONS.forEach(s=>{
    const lines = [];
    s.qs.forEach(q=>{ if(!vis(q)) return; const f=fmt(q); if(!f) return; lines.push((q.no?q.no+") ":"")+q.q+"\n   ← "+f.replace(/\n/g,"\n     ")); });
    if(lines.length){ L.push("", "━━━ "+(SECTIONS.indexOf(s)+1)+" · "+s.title+" ━━━"); L.push(...lines); }
  });
  return L.join("\n");
}

/* ===================== التقرير (PDF) ===================== */
function toB64u(u8){ let b=""; for(let i=0;i<u8.length;i+=8192) b+=String.fromCharCode.apply(null,u8.subarray(i,i+8192)); return btoa(b).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function fromB64u(t){ t=t.replace(/-/g,"+").replace(/_/g,"/"); while(t.length%4) t+="="; const b=atob(t), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function encodeData(obj){
  const bytes=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){
    const cs=new CompressionStream("gzip"), w=cs.writable.getWriter(); w.write(bytes); w.close();
    return "z"+toB64u(new Uint8Array(await new Response(cs.readable).arrayBuffer()));
  }
  return "p"+toB64u(bytes);
}
async function decodeData(code){
  code=code.trim(); const b=fromB64u(code.slice(1));
  if(code[0]==="z"){
    const ds=new DecompressionStream("gzip"), w=ds.writable.getWriter(); w.write(b); w.close();
    return JSON.parse(new TextDecoder().decode(await new Response(ds.readable).arrayBuffer()));
  }
  return JSON.parse(new TextDecoder().decode(b));
}
function richLine(l){
  let head="", rest=String(l); const i=rest.indexOf(" — ");
  if(i>0){ head=rest.slice(0,i); rest=rest.slice(i+3); }
  const segs=rest.split(" | ").map(sg=>{
    const m=sg.match(/^([^:]{1,30}:)\s*([\s\S]*)$/);
    if(m) return "<b>"+esc(m[1])+"</b> "+esc(m[2]);
    const w=sg.match(/^(\S+)([\s\S]*)$/);
    return w?"<b>"+esc(w[1])+"</b>"+esc(w[2]):esc(sg);
  });
  return (head?"<b>"+esc(head)+"</b><br>":"")+segs.join("<br>");
}
function reportData(){
  const sections=[];
  SECTIONS.forEach((s,si)=>{
    const rows=s.qs.filter(q=>vis(q)&&q.id!=="name"&&q.id!=="tg").map(q=>({no:q.no||"",q:q.q,a:fmt(q)})).filter(r=>r.a);
    if(rows.length) sections.push({n:si+1,title:s.title,color:s.color,rows:rows});
  });
  return {title:CONFIG.title,date:new Date().toLocaleDateString("en-GB"),name:String(A.name||"").trim(),tg:String(A.tg||"").trim(),
    facts:keyFacts().map(x=>({l:x[0],v:x[1]})),sections:sections};
}
function reportHTML(canBack){
  const facts=keyFacts();
  const secs=SECTIONS.map((s,si)=>{
    const rows=s.qs.filter(q=>vis(q)&&q.id!=="name"&&q.id!=="tg").map(q=>({q:q,f:fmt(q)})).filter(r=>r.f);
    if(!rows.length) return "";
    return `<section class="rp-sec" style="--c:${s.color}"><h3><b>${LATIN}${si+1}</b>${esc(s.title)}</h3><table>`
      + rows.map(r=>`<tr><td class="rq">${r.q.no?`<span class="rn">${LATIN}${r.q.no}</span>`:""}${esc(r.q.q)}</td><td class="ra">${r.f.split("\n").map(richLine).join("<br>")}</td></tr>`).join("")
      + `</table></section>`;
  }).join("");
  return `<div class="report"><div class="rp-bar noprint"><button type="button" class="btn pri" data-rp="print">🖨 حفظ كملف PDF</button>${canBack?`<button type="button" class="btn ghost" data-rp="back">رجوع</button>`:""}</div>`
    + `<div class="rp-head"><div><h1>${esc(CONFIG.title)}</h1><p>${esc(new Date().toLocaleDateString("en-GB"))}</p></div><div class="rp-who"><b>${esc(A.name||"")}</b>${A.tg?`<span>${esc(A.tg)}</span>`:""}</div></div>`
    + (facts.length?`<div class="rp-key">${facts.map(x=>`<div><small>${esc(x[0])}</small><b>${esc(x[1])}</b></div>`).join("")}</div>`:"")
    + (secs||`<p>ما فيه إجابات لعرضها.</p>`) + `</div>`;
}
function openReport(){
  document.body.classList.add("rmode"); document.title="تقرير — "+(String(A.name||"").trim()||"استبيان");
  main.innerHTML=reportHTML(true); window.scrollTo(0,0);
}
function pasteHTML(msg){
  return `<div class="review paste"><h2>إنشاء تقرير</h2><p>${msg||"الصقي هنا رابط التقرير أو كود البيانات من الإيميل."}</p><textarea class="txt" id="pasteBox" placeholder="الصقي هنا..."></textarea><button type="button" class="btn big" data-rp="gen">إنشاء التقرير</button></div>`;
}
async function loadFromText(t){
  t=t.trim(); let obj;
  if(t[0]==="{") obj=JSON.parse(t); else { const m=t.match(/#r=([A-Za-z0-9_-]+)/); obj=await decodeData(m?m[1]:t); }
  Object.keys(A).forEach(k=>delete A[k]); Object.assign(A,obj);
  document.title="تقرير — "+(String(A.name||"").trim()||"استبيان");
  main.innerHTML=reportHTML(false); window.scrollTo(0,0);
}
function showThanks(){
  $("#nav").hidden=true;
  main.innerHTML=`<div class="thanks"><div class="big">🎉</div><h2>وصلت إجاباتك!</h2><p>شكراً ${esc(A.name||"")} — وصلت إجاباتك لأخصائية التغذية.</p><button type="button" class="btn big" data-rp="open">📄 تحميل إجاباتك كملف PDF</button></div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ===================== المراجعة والإرسال ===================== */
function reviewHTML(){
  if(!CONFIG.scriptUrl && CONFIG.web3formsKey) loadPdfLibs().catch(()=>{});
  const {t,d}=totals();
  const configured = !!(CONFIG.scriptUrl||CONFIG.web3formsKey||CONFIG.formspreeUrl);
  const list = SECTIONS.map((s,i)=>{ const x=stats(s); return `<div class="sl"><span class="e" style="background:${s.color}">${LATIN}${i+1}</span><b>${esc(s.title)}</b><small>${x.d} / ${x.t}</small><button type="button" data-go="${i}">عدّل</button></div>`; }).join("");
  return `<div class="review"><h2>جاهز للإرسال 🎉</h2><p>جاوبت على ${LATIN}${d}${LATIN} من ${LATIN}${t}${LATIN} سؤال. تقدر ترجع وتعدّل أي قسم قبل الإرسال.</p>${list}`
    + (configured?"":`<div class="warn">⚙️ الإرسال للإيميل غير مفعّل بعد في هذا الملف. تقدرين تفعّلينه بوضع المفتاح في أعلى كود الملف (CONFIG). إلى ذلك الحين تقدرين تنسخين الإجابات أو تحمّلينها بالأزرار تحت.</div>`)
    + `<button type="button" class="btn big" id="sendBtn" data-act-send="1">إرسال الإجابات 🚀</button><div id="sendResult"></div>`
    + `<details><summary>معاينة الإجابات قبل الإرسال</summary><pre dir="rtl">${esc(buildSummary())}</pre></details></div>`;
}
function toolsHTML(){ return `<div class="tools"><button type="button" class="btn ghost" data-tool="copy">📋 نسخ الإجابات</button><button type="button" class="btn ghost" data-tool="dl">⬇️ تحميل ملف</button><button type="button" class="btn ghost" data-rp="open">📄 PDF</button></div>`; }
function copyText(txt){
  const fallback=()=>{ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove(); toast("تم النسخ ✅"); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>toast("تم النسخ ✅"),fallback); else fallback();
}
function download(txt){
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+txt],{type:"text/plain;charset=utf-8"}));
  a.download="استبيان-"+(String(A.name||"تغذية").trim().replace(/\s+/g,"-"))+".txt"; document.body.appendChild(a); a.click(); a.remove();
}
/* ===================== توليد PDF داخل المتصفح (للإرفاق بالإيميل) ===================== */
const LIBS={
  h2c:["https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js","https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"],
  pdf:["https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js","https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"]
};
function loadScript(urls){
  return new Promise((res,rej)=>{
    let i=0;
    const next=()=>{
      if(i>=urls.length) return rej(new Error("lib"));
      const sc=document.createElement("script"); sc.src=urls[i++];
      sc.onload=()=>res(); sc.onerror=()=>{ sc.remove(); next(); };
      document.head.appendChild(sc);
    };
    next();
  });
}
let libsP=null;
function loadPdfLibs(){
  if(window.html2canvas&&window.jspdf) return Promise.resolve();
  if(!libsP) libsP=Promise.all([window.html2canvas?0:loadScript(LIBS.h2c), window.jspdf?0:loadScript(LIBS.pdf)]).catch(e=>{ libsP=null; throw e; });
  return libsP;
}
async function makePdf(){
  await loadPdfLibs();
  if(document.fonts&&document.fonts.ready) { try{ await document.fonts.ready; }catch(e){} }
  const W=794, UH=Math.round(W*277/210);              // عرض الصفحة وارتفاع المساحة المفيدة (هامش ١٠مم فوق وتحت)
  const wrap=document.createElement("div");
  wrap.style.cssText="position:fixed;left:-12000px;top:0;width:"+W+"px;overflow:hidden;background:#fff;pointer-events:none";
  const box=document.createElement("div");
  box.style.cssText="width:"+W+"px;background:#fff";
  box.innerHTML=reportHTML(false);
  const bar=box.querySelector(".rp-bar"); if(bar) bar.remove();
  const rep=box.querySelector(".report"); if(rep){ rep.style.border="0"; rep.style.borderRadius="0"; rep.style.padding="0 26px"; }
  wrap.appendChild(box); document.body.appendChild(wrap);
  try{
    wrap.style.height="auto";
    const H=box.offsetHeight, top0=box.getBoundingClientRect().top;
    // أماكن القطع المسموحة: أسفل كل صف/ترويسة (ما نقطع نص من نصفه)
    const cuts=[...box.querySelectorAll("tr,.rp-head,.rp-key")].map(el=>Math.round(el.getBoundingClientRect().bottom-top0)).sort((a,b)=>a-b);
    const pages=[]; let y=0;
    while(y<H-2){
      let end=y+UH;
      if(end>=H) end=H;
      else { const c=cuts.filter(v=>v>y+120&&v<=end); if(c.length) end=c[c.length-1]; }
      pages.push([y,end]); y=end;
    }
    const J=window.jspdf.jsPDF, doc=new J({unit:"mm",format:"a4",orientation:"portrait",compress:true});
    for(let i=0;i<pages.length;i++){
      const [a,b]=pages[i], h=b-a;
      wrap.style.height=h+"px"; box.style.marginTop=(-a)+"px";
      const cv=await window.html2canvas(wrap,{scale:2,backgroundColor:"#fff",logging:false,useCORS:true,width:W,height:h,windowWidth:W});
      if(i>0) doc.addPage();
      doc.addImage(cv.toDataURL("image/jpeg",0.86),"JPEG",0,10,210,h*210/W,undefined,"FAST");
      cv.width=cv.height=0;
    }
    const blob=doc.output("blob");
    const d=new Date().toISOString().slice(0,10);
    return new File([blob],"nutrition-survey-"+d+".pdf",{type:"application/pdf"});
  } finally { wrap.remove(); }
}
async function submit(){
  const btn=$("#sendBtn"), out=$("#sendResult");
  if(!String(A.name||"").trim()){ go(0); return; }
  if(!CONFIG.scriptUrl && !CONFIG.web3formsKey && !CONFIG.formspreeUrl){
    out.innerHTML = `<div class="msg bad">الإرسال بالإيميل غير مفعّل بعد — استخدمي الأزرار لنسخ الإجابات أو تحميلها.</div>`+toolsHTML(); return;
  }
  btn.disabled=true; btn.textContent="جاري الإرسال... ⏳"; out.innerHTML="";
  try{
    let ok=false;
    const code=await encodeData(A);
    const link=/^https?:$/.test(location.protocol)?location.href.split("#")[0]+"#r="+code:"";
    const text=buildSummary(link);
    if(CONFIG.scriptUrl){
      const body=JSON.stringify({id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),secret:CONFIG.scriptSecret||"",
        subject:CONFIG.emailSubject+" — "+(A.name||""),summary:text,report:reportData()});
      const hdr={"Content-Type":"text/plain;charset=utf-8"};
      try{
        const r=await fetch(CONFIG.scriptUrl,{method:"POST",redirect:"follow",headers:hdr,body:body});
        const j=await r.json(); ok=!!j.ok;
      }catch(e1){
        // بعض المتصفحات تمنع قراءة الرد (CORS): نرسل مرة ثانية بدون قراءة الرد، والسكربت يتجاهل التكرار
        await fetch(CONFIG.scriptUrl,{method:"POST",mode:"no-cors",redirect:"follow",headers:hdr,body:body});
        ok=true;
      }
    } else if(CONFIG.web3formsKey){
      btn.textContent="جاري تجهيز ملف PDF... ⏳";
      let pdf=null; try{ pdf=await makePdf(); }catch(e){ pdf=null; }
      btn.textContent="جاري الإرسال... ⏳";
      const subj=CONFIG.emailSubject+" — "+(A.name||"");
      const send=async withPdf=>{
        const fd=new FormData();
        fd.append("access_key",CONFIG.web3formsKey); fd.append("subject",subj); fd.append("from_name",CONFIG.title);
        fd.append("name",A.name||""); fd.append("telegram",A.tg||""); fd.append("message",text); fd.append("answers_json",JSON.stringify(A));
        if(withPdf&&pdf) fd.append("attachment",pdf,pdf.name);
        const r=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{Accept:"application/json"},body:fd});
        const j=await r.json(); return !!j.success;
      };
      ok = pdf ? (await send(true).catch(()=>false)) : false;
      if(!ok) ok = await send(false);   // احتياط: لو فشل المرفق نرسل بدونه عشان ما تضيع الإجابات
    } else {
      const r=await fetch(CONFIG.formspreeUrl,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
        body:JSON.stringify({_subject:CONFIG.emailSubject+" — "+(A.name||""),name:A.name||"",telegram:A.tg||"",message:text,answers_json:JSON.stringify(A)})});
      ok=r.ok;
    }
    if(!ok) throw new Error("fail");
    try{ localStorage.removeItem(KEY); }catch(e){}
    sent=true; showThanks();
  }catch(e){
    btn.disabled=false; btn.textContent="إعادة المحاولة 🔁";
    out.innerHTML=`<div class="msg bad">ما قدرت أرسل الإجابات (تأكد من الاتصال بالإنترنت). لا تقلق، إجاباتك محفوظة — جرّب مرة ثانية، أو انسخها وأرسلها يدوياً.</div>`+toolsHTML();
  }
}

/* ===================== الأحداث ===================== */
document.addEventListener("click",e=>{
  const rp=e.target.closest("[data-rp]");
  if(rp){
    const k=rp.dataset.rp;
    if(k==="print") window.print();
    else if(k==="open") openReport();
    else if(k==="back"){ document.body.classList.remove("rmode"); document.title=CONFIG.title; if(sent) showThanks(); else renderStep(); window.scrollTo(0,0); }
    else if(k==="gen"){ loadFromText($("#pasteBox").value).catch(()=>toast("ما قدرت أقرأ البيانات — تأكدي من نسخها كاملة")); }
    return;
  }
  const g=e.target.closest("[data-go]"); if(g){ go(+g.dataset.go); return; }
  const tl=e.target.closest("[data-tool]"); if(tl){ const txt=buildSummary(); tl.dataset.tool==="copy"?copyText(txt):download(txt); return; }
  if(e.target.closest("[data-act-send]")){ submit(); return; }
});
$("#prev").addEventListener("click",()=>go(cur-1));
$("#next").addEventListener("click",()=>go(cur+1));

main.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el||!main.contains(el)) return;
  const act=el.dataset.act, id=el.dataset.q, q=Q[id];
  switch(act){
    case "single": {
      const o=q.o[+el.dataset.i];
      if(A[id]===o.l){ delete A[id]; delete A[id+"_o"]; } else { A[id]=o.l; if(!o.other) delete A[id+"_o"]; }
      redraw(id); break;
    }
    case "multi": {
      const o=q.o[+el.dataset.i]; let arr=(A[id]||[]).slice();
      if(arr.includes(o.l)) arr=arr.filter(x=>x!==o.l);
      else if(o.none) arr=[o.l];
      else { const nn=q.o.filter(x=>x.none).map(x=>x.l); arr=arr.filter(x=>!nn.includes(x)); arr.push(o.l); }
      if(arr.length) A[id]=arr; else delete A[id];
      if(!arr.some(l=>(q.o.find(x=>x.l===l)||{}).other)) delete A[id+"_o"];
      redraw(id); break;
    }
    case "mx": {
      const it=q.items[+el.dataset.i], f=el.dataset.f, v=el.dataset.v;
      const m=A[id]=A[id]||{}, d=m[it]=m[it]||{};
      if(f==="prep"){
        const val=q.prep.o[+v], arr=d.prep=d.prep||[], k=arr.indexOf(val);
        if(k>=0) arr.splice(k,1); else arr.push(val);
        if(!arr.length) delete d.prep;
      } else {
        if(d[f]===v) delete d[f]; else d[f]=v;
        if(f==="eat" && d.eat!=="نعم"){ delete d.amount; delete d.prep; }
      }
      if(!Object.keys(d).length) delete m[it];
      if(!Object.keys(m).length) delete A[id];
      redraw(id); break;
    }
    case "zone": {
      const z=+el.dataset.z, arr=(A[id]||[]).slice(), k=arr.indexOf(z);
      if(k>=0) arr.splice(k,1); else arr.push(z);
      arr.sort((a,b)=>a-b);
      if(arr.length) A[id]=arr; else delete A[id];
      redraw(id); break;
    }
    case "xadd": { const xs=A[id+"_x"]=A[id+"_x"]||[]; xs.push({}); redraw(id); break; }
    case "xdel": { const xs=A[id+"_x"]||[]; xs.splice(+el.dataset.i,1); if(!xs.length) delete A[id+"_x"]; redraw(id); break; }
    case "mxo-on": A[id+"_mo"]={}; redraw(id); break;
    case "mxo-off": delete A[id+"_mo"]; redraw(id); break;
    case "mxo": { const o=A[id+"_mo"]; if(!o) break; const f=el.dataset.f, v=el.dataset.v; if(o[f]===v) delete o[f]; else o[f]=v; if(f==="eat"&&o.eat!=="نعم") delete o.amount; redraw(id); break; }
    case "rowadd": { const rows=A[id]=(A[id]&&A[id].length)?A[id]:[{}]; rows.push({}); redraw(id); break; }
    case "rowdel": {
      const rows=A[id]||[{}]; rows.splice(+el.dataset.i,1);
      if(rows.length&&rows.some(r=>r.n||r.v)) A[id]=rows; else delete A[id];
      redraw(id); break;
    }
  }
});
main.addEventListener("input",e=>{
  const el=e.target, act=el.dataset&&el.dataset.act; if(!act) return; const id=el.dataset.q;
  switch(act){
    case "val": { if(el.value.trim()==="") delete A[id]; else A[id]=el.value; if(id==="name"){ const s=main.querySelector('[data-qid="name"]'); if(s) s.classList.remove("err"); } break; }
    case "oth": A[id+"_o"]=el.value; break;
    case "xname": { const xs=A[id+"_x"]||[], x=xs[+el.dataset.i]; if(x) x.n=el.value; break; }
    case "mxo-name": { const o=A[id+"_mo"]; if(o) o.n=el.value; break; }
    case "maptxt": if(el.value.trim()==="") delete A[id+"_t"]; else A[id+"_t"]=el.value; break;
    case "nval": { const o=A[id]=A[id]||{}; if(el.value==="") delete o[el.dataset.k]; else o[el.dataset.k]=el.value; if(!Object.keys(o).length) delete A[id]; break; }
    case "row": { const rows=A[id]=A[id]||[{}]; const i=+el.dataset.i; while(rows.length<=i) rows.push({}); rows[i][el.dataset.f]=el.value; break; }
    case "scale": setScale(el); break;
    default: return;
  }
  afterChange();
});
main.addEventListener("change",e=>{
  const el=e.target, act=el.dataset&&el.dataset.act; if(act!=="rank"&&act!=="xrank") return;
  const id=el.dataset.q, q=Q[id], r=A[id]=A[id]||{}, xs=A[id+"_x"]||[];
  const n = el.value===""?0:+el.value;
  if(n){ for(const k in r) if(r[k]===n) delete r[k]; xs.forEach(x=>{ if(x.r===n) delete x.r; }); }
  if(act==="rank"){ const it=q.items[+el.dataset.i]; if(n) r[it]=n; else delete r[it]; }
  else { const x=xs[+el.dataset.i]; if(x){ if(n) x.r=n; else delete x.r; } }
  if(!Object.keys(r).length) delete A[id];
  redraw(id);
});
main.addEventListener("pointerup",e=>{
  const el=e.target.closest&&e.target.closest('[data-act="scale"]');
  if(el&&A[el.dataset.q]===undefined){ setScale(el); afterChange(); }
});

/* ===================== تشغيل ===================== */
$("#brandTitle").textContent = CONFIG.title;
document.title = CONFIG.title;
const hm=location.hash.match(/^#r=([A-Za-z0-9_-]+)$/);
if(hm||location.hash==="#report"){
  document.body.classList.add("rmode");
  if(hm) decodeData(hm[1]).then(d=>{ Object.assign(A,d); document.title="تقرير — "+(String(A.name||"").trim()||"استبيان"); main.innerHTML=reportHTML(false); }).catch(()=>{ main.innerHTML=pasteHTML("الرابط ناقص أو غير صحيح. الصقي الكود هنا."); });
  else main.innerHTML=pasteHTML();
} else { load(); buildSteps(); renderStep(); }
})();
